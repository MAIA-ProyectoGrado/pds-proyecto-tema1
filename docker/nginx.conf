server {
    listen 8080;
    server_name _;

    # Tablero estático
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    # El navegador habla con un solo origen: nginx hace proxy al servicio de
    # inferencia. Así no hace falta CORS ni exponer el puerto 8000 al exterior.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # La recuperación descarga el PDF del artículo citado y calcula embeddings:
        # puede tardar varios segundos en frío.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }
}
