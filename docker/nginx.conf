server {
    listen 8080;
    server_name _;

    # Tablero estático
    root /usr/share/nginx/html;
    index index.html;

    # Por encima del tope de la API (SCIF_MAX_BODY_KB, máximo 16 MB): así es la API
    # la que rechaza las peticiones grandes, con un mensaje en JSON (413).
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    # El navegador habla con un solo origen: nginx hace proxy al servicio de
    # inferencia. Así no hace falta CORS ni exponer el puerto 8000 al exterior.
    # La documentación interactiva queda en /api/docs (SCIF_ROOT_PATH=/api).
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Se reemplaza, no se encadena: nginx es el borde, y una cabecera enviada por
        # el cliente permitiría saltarse el límite de peticiones por IP.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # La recuperación descarga el PDF del artículo citado y calcula embeddings:
        # puede tardar varios segundos en frío.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }
}
